<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fweddie: a husky head, front view. Drawn here rather than taken from a
       stock library, so there is no licence to track.

       It is two-tone on purpose. The silhouette is WHITE with a dark outline,
       which is what makes it legible on both palettes: on the warm charcoal
       dark theme the white face carries the shape, and on the paper-white light
       theme the dark outline does (white on #faf9f5 is 1.06:1, i.e. invisible).
       Every husky marking is therefore DARK and sits INSIDE the white face,
       where there is always white behind it:
         * erect triangular ears with dark inner triangles,
         * the "goggles": two dark patches round the eyes,
         * white eyes inside those patches,
         * a dark nose and the mouth line below it.
       The dark patches leave the white blaze between them, and that blaze plus
       the goggles is the shape the eye reads as "husky" at 26 px. The outline is
       2.6 units at 64, i.e. about 1 px at avatar size, which is the thinnest
       line that still survives.

       Note that an XML comment may not contain a double hyphen, which is why
       this one uses none. -->
  <g stroke="#1b1b1b" stroke-width="2.6" stroke-linejoin="round"
     stroke-linecap="round" fill="none">
    <!-- ears, behind the skull, so they are drawn first -->
    <path d="M14.5 20.5 L10.5 3.5 L27 12.5 Z" fill="#ffffff"/>
    <path d="M49.5 20.5 L53.5 3.5 L37 12.5 Z" fill="#ffffff"/>
    <path d="M16.2 17.6 L13.6 9.2 L22.6 14.2 Z" fill="#1b1b1b" stroke-width="1.5"/>
    <path d="M47.8 17.6 L50.4 9.2 L41.4 14.2 Z" fill="#1b1b1b" stroke-width="1.5"/>

    <!-- skull and muzzle in one outline: broad at the top, tapering to a
         rounded chin, with a small cheek tuft on each side -->
    <path d="M32 9.8
             C23.2 9.8 15.5 16.8 15.5 26.6
             C15.5 29.6 16.4 31.8 17.6 33.6
             C17.9 39.4 21.6 46.4 32 55.4
             C42.4 46.4 46.1 39.4 46.4 33.6
             C47.6 31.8 48.5 29.6 48.5 26.6
             C48.5 16.8 40.8 9.8 32 9.8 Z"
          fill="#ffffff"/>

    <!-- the goggles -->
    <ellipse cx="25.6" cy="27.4" rx="6.2" ry="6.8" fill="#1b1b1b" stroke="none"/>
    <ellipse cx="38.4" cy="27.4" rx="6.2" ry="6.8" fill="#1b1b1b" stroke="none"/>
    <!-- eyes: white inside the patch, so the patch does not read as a hole -->
    <ellipse cx="25.6" cy="27.8" rx="2.3" ry="2.7" fill="#ffffff" stroke="none"/>
    <ellipse cx="38.4" cy="27.8" rx="2.3" ry="2.7" fill="#ffffff" stroke="none"/>

    <!-- nose -->
    <path d="M28.4 40.2 L35.6 40.2 C35.6 44.2 33.9 46.8 32 46.8
             C30.1 46.8 28.4 44.2 28.4 40.2 Z"
          fill="#1b1b1b" stroke-width="1.5"/>
    <!-- mouth -->
    <path d="M32 46.8 L32 49.4" stroke-width="1.9"/>
    <path d="M32 49.4 C30.1 49.4 28.9 48.3 28.3 47" stroke-width="1.9"/>
    <path d="M32 49.4 C33.9 49.4 35.1 48.3 35.7 47" stroke-width="1.9"/>
  </g>
</svg>
