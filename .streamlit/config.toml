# Streamlit settings for the WanDog dashboard.
#
# NOTE: the palette does NOT live here. Streamlit's theme is fixed when the
# server starts -- st._config.set_option("theme.base", ...) from a running script
# does not repaint, and Streamlit caches the active theme in localStorage, so a
# server-side change is ignored on the next load. Measured; see the "Dashboard v2"
# section of WanDog-notes.md.
#
# The dashboard therefore carries its own light and dark palettes as CSS custom
# properties in dashboard.py and picks one server-side, so the first paint is
# already correct. What is set here is only what a CSS variable cannot reach: the
# widget defaults Streamlit computes before any of our CSS runs -- the text field,
# the code blocks a tool result renders into, the spinner.


[theme]
# "light" matches the dashboard's default (DEFAULT_THEME in dashboard.py); the
# in-page toggle switches to dark without consulting this value. Keeping the two
# in step means the brief moment before our stylesheet applies is the same colour
# as the page, rather than a flash of the other theme on every load. These are the
# light palette's own values, copied from THEMES["light"], not an approximation.
base = "light"
primaryColor = "#c96442"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#f0eee6"
textColor = "#1f1e1d"
font = "sans serif"


[server]
headless = true


[browser]
gatherUsageStats = false
