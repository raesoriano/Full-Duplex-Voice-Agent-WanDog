# Streamlit settings for the WanDog dashboard.
#
# NOTE: the palette does NOT live here. Streamlit's theme is fixed when the
# server starts -- st._config.set_option("theme.base", ...) from a running script
# does not repaint, and Streamlit caches the active theme in localStorage, so a
# server-side change is ignored on the next load. Measured; see the "Dashboard v2"
# section of WanDog-notes.md.
#
# The dashboard therefore carries its own light and dark palettes as CSS custom
# properties in dashboard.py and picks one server-side, so the first paint is
# already correct. What is set here is only what a CSS variable cannot reach: the
# widget defaults Streamlit computes before any of our CSS runs -- the text field,
# the code blocks a tool result renders into, the spinner.


[theme]
# "light" matches the dashboard's default (DEFAULT_THEME in dashboard.py); the
# in-page toggle switches to dark without consulting this value. Keeping the two
# in step means the brief moment before our stylesheet applies is the same colour
# as the page, rather than a flash of the other theme on every load. These are the
# light palette's own values, copied from THEMES["light"], not an approximation.
base = "light"
primaryColor = "#c96442"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#f0eee6"
textColor = "#1f1e1d"
font = "sans serif"


[server]
headless = true

# Polling, not inotify. This is not a preference -- inotify is broken here.
#
# The dashboard runs from a checkout that contains a .venv (3,921 directories)
# and a .git (256). Streamlit's event watcher schedules ONE recursive watch on
# the script folder, so all 4,397 directories get registered. When the kernel
# queue (16,384 events) overflows, watchdog 7.1.0 rebuilds every watch by
# os.walk-ing the tree again -- and that re-walk is itself what refills the
# queue. The handler feeds the next overflow. Measured on this machine:
#
#   handler as shipped : 17 overflows in 6 s, 0 filesystem events delivered
#   handler disabled   :  1 overflow  in 6 s   (so the loop is the handler)
#   CPU, auto          : 101% of one core, continuously
#   CPU, poll          :   0%
#
# The practical damage is that change detection silently stops: `auto` missed a
# real edit to dashboard.py during measurement, while `poll` saw it. The stderr
# spam is only the visible part.
#
# server.folderWatchBlacklist does NOT fix this, and was measured: 14 overflows
# with no blacklist, 16 with .venv and .git listed, 17 with globs. It filters
# module paths only (local_sources_watcher.py:295), never the recursive
# schedule (event_based_path_watcher.py:228).
#
# "poll" rather than "none" keeps hot reload working; the only cost is that a
# save can take up to the 0.2 s polling period to be noticed. Revisit if this
# checkout ever stops carrying a venv next to the app.
fileWatcherType = "poll"


[browser]
gatherUsageStats = false
