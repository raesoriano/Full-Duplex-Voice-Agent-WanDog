# Fweddie -- tool secrets TEMPLATE.
#
# Copy this file to `secrets.yaml` and fill in what you have:
#
#     cp secrets.example.yaml secrets.yaml
#     chmod 600 secrets.yaml
#
# `secrets.yaml` is git-ignored and must never be committed. This template
# is tracked so the list of keys stays reviewable in a diff.
#
# HOW KEYS ARE RESOLVED (first hit wins, per key):
#   1. this file            -- per-project override
#   2. OS keychain          -- service "onit", what `onit setup` writes
#   3. left unset           -- that one tool degrades; the agent still runs
#
# Because the keychain is consulted second, a machine already set up with
# `onit setup` needs NO secrets.yaml at all. This file only overrides.
# Deleting it must never break anything -- that is a tested property.
#
# Leave a value as "" (or delete the line) to fall through to the keychain.
#
# QUOTE EVERY VALUE. Unquoted YAML silently retypes scalars: 12345 becomes an
# int, `on`/`yes`/`no` become bools, and a value containing ": " or " #" gets
# split or truncated. A real token can look like any of those.
#
# SECURITY: the agent's `bash` tool runs as you, so it can read this file.
# Keep only keys you are willing to see leak here. The OS keychain is the
# safer home for anything high-value (e.g. a GitHub PAT with repo scope).

# --- Tools ---------------------------------------------------------------

# get_weather. Without it the weather tool returns
# "OpenWeather API key not set".
#   https://home.openweathermap.org/api_keys
openweathermap_api_key: ""

# search -- first tier, tried before Ollama and the DuckDuckGo fallback.
# Without it search still works, but falls back to DuckDuckGo (lower quality).
#   https://app.tavily.com
tavily_api_key: ""

# search -- second tier, also used by Ollama cloud endpoints.
#   https://ollama.com/settings/keys
ollama_api_key: ""

# github_repo tool, and `git push` from the bash tool.
# Needs repo scope. Consider leaving this one in the keychain instead.
#   https://github.com/settings/tokens
github_token: ""

# Model downloads from the HuggingFace hub. Without it, downloads are
# rate-limited but still work.
#   https://huggingface.co/settings/tokens
huggingface_token: ""
